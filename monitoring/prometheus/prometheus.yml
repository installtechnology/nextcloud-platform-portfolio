global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
# Service probes arrive through Alloy's embedded Blackbox and remote_write.
