---
- name: Preparar host Ubuntu para a futura plataforma
  hosts: platform
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validar endereço fornecido e sistema suportado
      ansible.builtin.assert:
        that:
          - ansible_host | default('') | length > 0
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] in ['22.04', '24.04']
          - ansible_facts['architecture'] in ['x86_64', 'aarch64']
        fail_msg: Informe PLATFORM_HOST e use Ubuntu LTS 22.04 ou 24.04 suportado.
  roles:
    - role: common
    - role: docker
