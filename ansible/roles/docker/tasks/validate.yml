---
- name: Consultar fatos dos serviços
  ansible.builtin.service_facts:

- name: Confirmar Docker ativo
  ansible.builtin.assert:
    that:
      - ansible_facts['services']['docker.service']['state'] == 'running'

# Builtins não oferecem consulta do daemon/versão Compose: probes CLI somente leitura.
- name: Consultar daemon Docker pelo socket local
  ansible.builtin.command:
    argv: [docker, info]
  changed_when: false

- name: Consultar versão do Compose Plugin
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: docker_compose_version
  changed_when: false

- name: Confirmar resposta do Compose Plugin
  ansible.builtin.assert:
    that:
      - docker_compose_version.stdout | trim | length > 0

- name: Validar acesso Docker pelo usuário operacional quando habilitado
  ansible.builtin.command:
    argv: [docker, info]
  become: true
  become_user: "{{ docker_operational_user }}"
  changed_when: false
  when: docker_allow_operational_user | bool
